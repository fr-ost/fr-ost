# Rebuilds the contribution-snake SVGs from public GitHub contributions and
# writes them to the `output` branch. Uses the workflow's default
# GITHUB_TOKEN with contents: write. No extra secrets.
name: contribution-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E09A00&color_dots=#FFF7FB,#F8C4DE,#FF6BA8,#FF2E93,#6C2BD9
            dist/github-contribution-grid-snake-dark.svg?color_snake=#7CFFCB&color_dots=#14081F,#3D1A4A,#8A2468,#FF2E93,#FFB703

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: "false"
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
